# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# 2026-09-02: 0.1 -> 1.0. Todo movimento que nao seta o fator explicitamente
# (RViz, MGIs sem setMaxVelocityScalingFactor) rodava a 10% dos limites abaixo.
# A velocidade fisica maxima continua sendo os max_velocity/max_acceleration por junta.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
# 2026-08-07 v2: 1.0 -> 0.6 rad/s (accel 0.5). O corte inicial p/ 0.25 deixou
# os movimentos gravados 2.7x mais lentos que o real (WS->home: 2.7s medido
# vs 7.3s planejado a 0.25). 0.6 ~= capacidade tipica medida; movimentos
# extremos (dobra grande contra gravidade) lagam, e o monitor 3x+3s absorve.
# Historico: a 1.0 o monitor cancelava execucao viva ("taking too long").
# Garra (6/7) intacta: movimentos curtos, nunca estourou o monitor.
# 2026-09-02 v3 (pedido: velocidade maxima): 0.9/0.6 -> 1.2/1.0 nas juntas 1-5.
# O plano pode correr na frente do braco: o monitor 3x+3s (moveit_controllers)
# e o goal_time 5s + goal 0.30 rad do JTC (Pi) absorvem o atraso; o JTC nao tem
# tolerancia de trajeto, entao nao aborta no meio. Se aparecer "taking too
# long" ou GOAL_TOLERANCE_VIOLATED, voltar para 0.9/0.6. O teto FISICO esta
# nos servos (Profile Velocity/Accel na EEPROM + ganho P) — o driver nao os
# programa; destravar isso e' no Dynamixel Wizard, nao aqui.
joint_limits:
  manip_joint1:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint2:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint3:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint4:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint5:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint6:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint7:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0